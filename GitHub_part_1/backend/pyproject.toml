[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osvitnii-protses"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=23,<26", "PyJWT>=2.10,<3", "numpy>=2,<3",
]

[project.optional-dependencies]
nlp = [
  "sentence-transformers>=5.2,<6", "transformers>=4.50,<5",
  "torch>=2.6,<3", "stanza==1.10.1", "scikit-learn>=1.6,<2", "sentencepiece>=0.2,<1",
]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated PostgreSQL database", "real_model: requires cached NLP weights"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
