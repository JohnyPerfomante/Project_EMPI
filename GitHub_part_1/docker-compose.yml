name: ${COMPOSE_PROJECT_NAME:-osvitnii-protses-github}

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-osvitnii-protses-github}-api:local
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: api
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

x-worker: &worker
  image: ${COMPOSE_PROJECT_NAME:-osvitnii-protses-github}-worker:local
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: worker
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  volumes:
    - models:/models

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  models:
    <<: *worker
    command: ["python", "-m", "scripts.prepare_models"]
  worker:
    <<: *worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  models:
